# Builds the DeckKit zip (scripts/package.sh).
# - Push a tag like v1.2.0: a GitHub Release with the zip attached.
# - Run it by hand (Actions > Release > Run workflow): just the zip, as a build artifact, no release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the zip
        id: build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION=""
          ZIP=$(scripts/package.sh $VERSION | head -1)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload as a build artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: DeckKit-test-build
          path: ${{ steps.build.outputs.zip }}

      - name: Create the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" \
            --title "DeckKit $GITHUB_REF_NAME" --generate-notes
